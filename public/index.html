<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Arena</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="arena-container">
    <div class="top-bar">
      <h1>⚡ Sudoku Arena</h1>
      <div class="theme-picker">
        <label for="theme-select">🎨 Theme:</label>
        <select id="theme-select">
          <option value="dark">Midnight Dark</option>
          <option value="neon">Cyberpunk Neon</option>
          <option value="emerald">Emerald Forest</option>
          <option value="paper">Paper Light</option>
        </select>
      </div>
    </div>

    <!-- Lobby View -->
    <div id="lobby-view" class="card">
      <div class="input-group">
        <label for="username">Nickname:</label>
        <input type="text" id="username" placeholder="e.g. MasterSolver" maxlength="12" />
      </div>

      <div class="host-settings">
        <div class="setting-col">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">Easy (20 Blanks)</option>
            <option value="medium" selected>Medium (35 Blanks)</option>
            <option value="hard">Hard (50 Blanks)</option>
          </select>
        </div>

        <div class="setting-col">
          <label for="max-players">Players:</label>
          <select id="max-players">
            <option value="2" selected>2 Players</option>
            <option value="3">3 Players</option>
            <option value="4">4 Players</option>
          </select>
        </div>

        <div class="setting-col">
          <label for="duration">Timer:</label>
          <select id="duration">
            <option value="5">5 Mins</option>
            <option value="10" selected>10 Mins</option>
            <option value="15">15 Mins</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="create-btn" class="btn primary">Create Room</button>
        <div class="divider">OR</div>
        <div class="join-group">
          <input type="text" id="room-code-input" placeholder="5-Letter Room Code" maxlength="5" />
          <button id="join-btn" class="btn secondary">Join Room</button>
        </div>
      </div>

      <div id="room-status" class="status-msg"></div>
      <div id="lobby-roster" class="roster-list"></div>
    </div>

    <!-- Active Game Arena -->
    <div id="game-view" class="card hidden">
      <div class="hud">
        <div class="hud-top">
          <div class="room-tag">Room: <span id="current-room"></span></div>
          <div class="my-lives" id="my-lives">Lives: ❤️❤️❤️</div>
          <div class="timer-box">⏳ <span id="timer-display">10:00</span></div>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
      </div>

      <div class="board-wrapper">
        <div id="sudoku-grid" class="sudoku-grid"></div>
      </div>

      <!-- Elimination Banner (shown only to knocked-out players) -->
      <div id="eliminated-banner" class="banner hidden">
        ❌ You were eliminated (3 mistakes)! Spectating rest of match...
      </div>

      <!-- End of Match Leaderboard Modal -->
      <div id="winner-modal" class="modal hidden">
        <div class="modal-content">
          <h2 id="winner-title">🏆 Match Finished</h2>
          <p id="winner-reason" class="winner-reason"></p>

          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Solved</th>
                <th>Mistakes</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>

          <button class="btn primary" onclick="location.reload()">Back to Lobby</button>
        </div>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
