<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 20 Curated Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Comfortaa:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Dancing+Script:wght@700&family=Fira+Code:wght@600&family=Fredoka:wght@600;700&family=Inter:wght@600;800&family=JetBrains+Mono:wght@700&family=Lobster&family=Montserrat:wght@600;800&family=Orbitron:wght@700&family=Oswald:wght@600&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,600&family=Poiret+One&family=Press+Start+2P&family=Righteous&family=Russo+One&family=Silkscreen&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Full-Screen Realistic Scenery -->
  <div id="scenic-bg" class="scenic-bg">
    <div class="scenic-overlay"></div>
  </div>

  <!-- Ambient White Glitter Particle Canvas -->
  <canvas id="glitter-canvas" class="glitter-canvas"></canvas>

  <!-- End-Game Screen Glow Layer -->
  <div id="result-flash-screen" class="result-flash-screen"></div>

  <div class="arena-container">
    <div class="top-bar">
      <h1>⚡ Sudoku Arena</h1>
      <button id="settings-open-btn" class="icon-btn" title="Game Settings">
        ⚙️ Settings
      </button>
    </div>

    <!-- Lobby View -->
    <div id="lobby-view" class="card frosted">
      <div class="input-group">
        <label for="username">Nickname:</label>
        <input type="text" id="username" placeholder="e.g. MasterSolver" maxlength="12" />
      </div>

      <div class="mode-select-wrap">
        <label class="radio-label">
          <input type="radio" name="game-mode" value="multi" checked />
          <span>👥 Multiplayer Room</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="game-mode" value="bot" />
          <span>🤖 Solo vs Bot</span>
        </label>
      </div>

      <div class="host-settings">
        <div class="setting-col">
          <label for="symbol-set-select">Symbol Set:</label>
          <select id="symbol-set-select">
            <option value="numbers">1 - 9 (Standard)</option>
            <option value="letters">A - I (Letters)</option>
            <option value="roman">I - IX (Roman)</option>
            <option value="emojis">🍎 Fruits (Emojis)</option>
            <option value="shapes">★ Shapes</option>
          </select>
        </div>

        <div class="setting-col">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">Easy (20 Blanks)</option>
            <option value="medium" selected>Medium (35 Blanks)</option>
            <option value="hard">Hard (50 Blanks)</option>
          </select>
        </div>

        <div class="setting-col" id="col-max-players">
          <label for="max-players">Players:</label>
          <select id="max-players">
            <option value="2" selected>2 Players</option>
            <option value="3">3 Players</option>
            <option value="4">4 Players</option>
          </select>
        </div>

        <div class="setting-col hidden" id="col-bot-speed">
          <label for="bot-speed">Bot Skill:</label>
          <select id="bot-speed">
            <option value="slow">Casual (Slow)</option>
            <option value="medium" selected>Balanced</option>
            <option value="fast">Master (Fast)</option>
          </select>
        </div>

        <div class="setting-col">
          <label for="custom-duration">Time (Mins):</label>
          <input type="number" id="custom-duration" min="1" max="60" value="10" />
        </div>
      </div>

      <div class="actions">
        <button id="create-btn" class="btn primary">Start Game</button>
        <div id="multi-join-container">
          <div class="divider">OR</div>
          <div class="join-group">
            <input type="text" id="room-code-input" placeholder="5-Letter Room Code" maxlength="5" />
            <button id="join-btn" class="btn secondary">Join Room</button>
          </div>
        </div>
      </div>

      <div id="room-status" class="status-msg"></div>
      <div id="lobby-roster" class="roster-list"></div>
    </div>

    <!-- Active Game Arena -->
    <div id="game-view" class="card frosted hidden">
      <div class="hud">
        <div class="hud-top">
          <div class="room-tag">Match: <span id="current-room"></span></div>
          <div class="my-lives" id="my-lives">Lives: ❤️❤️❤️</div>
          <div class="timer-box">⏳ <span id="timer-display">10:00</span></div>
          <button id="quit-btn" class="btn danger-small" title="Quit match">Resign 🏳️</button>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
      </div>

      <div class="board-wrapper">
        <div id="sudoku-grid" class="sudoku-grid"></div>
      </div>

      <div class="symbol-pad-container">
        <span class="symbol-pad-title">Tap a cell, then tap a symbol to place it:</span>
        <div id="symbol-pad" class="symbol-pad"></div>
      </div>

      <div id="eliminated-banner" class="banner hidden">
        ❌ You were eliminated!
      </div>
    </div>
  </div>

  <!-- Settings Modal Popup -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card frosted settings-card">
      <div class="modal-header">
        <h2>⚙️ Arena Settings</h2>
        <span class="close-x" id="settings-close-x">&times;</span>
      </div>

      <div class="settings-grid">
        <!-- 20 Realistic Photographic Backdrops -->
        <div class="setting-row">
          <label for="bg-select">Scenery Backdrop:</label>
          <select id="bg-select">
            <option value="milkyway" selected>🌌 1. Milky Way Galaxy</option>
            <option value="sunset">🌄 2. Mountain Sunset</option>
            <option value="forest">🌲 3. Misty Redwood Forest</option>
            <option value="city">🏙️ 4. Tokyo Night City</option>
            <option value="ocean">🌊 5. Twilight Ocean</option>
            <option value="mountains">🏔️ 6. Snowy Alpine Peak</option>
            <option value="desert">🏜️ 7. Sahara Desert Dunes</option>
            <option value="aurora">🌌 8. Arctic Aurora Borealis</option>
            <option value="autumn">🍁 9. Golden Autumn Forest</option>
            <option value="cyber">🌆 10. Cyberpunk Metro</option>
            <option value="foglake">🛶 11. Foggy Mountain Lake</option>
            <option value="nebula">✨ 12. Deep Space Nebula</option>
            <option value="bamboo">🎋 13. Kyoto Bamboo Forest</option>
            <option value="temple">⛩️ 14. Ancient Mist Temple</option>
            <option value="waterfall">💦 15. Jungle Waterfall</option>
            <option value="cherry">🌸 16. Cherry Blossom Garden</option>
            <option value="rain">🌧️ 17. Rain on Window Glass</option>
            <option value="lightning">⚡ 18. Storm Lightning Sky</option>
            <option value="wheat">🌾 19. Golden Hour Wheat Field</option>
            <option value="canyon">🏜️ 20. Grand Canyon Sunset</option>
          </select>
        </div>

        <!-- 20 Typography Options -->
        <div class="setting-row">
          <label for="font-select">Font Family:</label>
          <select id="font-select">
            <option value="default" selected>1. System Clean (Default)</option>
            <option value="fredoka">2. Fredoka (Fun / Rounded)</option>
            <option value="cinzel">3. Cinzel (Royal Serif)</option>
            <option value="jetbrains">4. JetBrains Mono (Dev Code)</option>
            <option value="arcade">5. Press Start 2P (8-Bit Retro)</option>
            <option value="inter">6. Inter (Modern Tech)</option>
            <option value="montserrat">7. Montserrat (Geometric Clean)</option>
            <option value="orbitron">8. Orbitron (Sci-Fi Futuristic)</option>
            <option value="righteous">9. Righteous (Synthwave Retro)</option>
            <option value="space">10. Space Grotesk (Neo-Brutalist)</option>
            <option value="playfair">11. Playfair Display (Luxury Editorial)</option>
            <option value="cormorant">12. Cormorant Garamond (Classic Antique)</option>
            <option value="oswald">13. Oswald (Condensed Bold)</option>
            <option value="russo">14. Russo One (Heavy Impact)</option>
            <option value="comfortaa">15. Comfortaa (Soft Smooth)</option>
            <option value="fira">16. Fira Code (Matrix Monospace)</option>
            <option value="silkscreen">17. Silkscreen (Pixel Minimal)</option>
            <option value="lobster">18. Lobster (Bold Vintage Script)</option>
            <option value="pacifico">19. Pacifico (Surf Casual Brush)</option>
            <option value="dancing">20. Dancing Script (Elegant Flow)</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="theme-select">Theme Palette:</label>
          <select id="theme-select">
            <option value="dark">Midnight Dark</option>
            <option value="neon">Cyber Neon</option>
            <option value="emerald">Emerald</option>
            <option value="sunset">Sunset Orange</option>
            <option value="dracula">Dracula</option>
            <option value="amber">Amber</option>
            <option value="paper">Paper Light</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="custom-color-picker">Accent Color:</label>
          <div class="color-picker-wrap">
            <input type="color" id="custom-color-picker" value="#38bdf8" />
            <span class="color-hint">Tap circle to pick</span>
          </div>
        </div>

        <div class="setting-toggle-row">
          <label for="music-toggle">🎵 Background Music</label>
          <input type="checkbox" id="music-toggle" class="toggle-checkbox" />
        </div>

        <div class="setting-toggle-row">
          <label for="sound-toggle">🔊 Game Sound FX</label>
          <input type="checkbox" id="sound-toggle" checked class="toggle-checkbox" />
        </div>

        <div class="setting-toggle-row">
          <label for="emoji-toggle">✨ Completion Emojis</label>
          <input type="checkbox" id="emoji-toggle" checked class="toggle-checkbox" />
        </div>
      </div>

      <button id="settings-save-btn" class="btn primary full-width">Done</button>
    </div>
  </div>

  <!-- End of Match Leaderboard Modal -->
  <div id="winner-modal" class="modal-backdrop hidden">
    <div class="modal-card frosted">
      <div class="modal-header">
        <h2 id="winner-title">🏆 Match Over</h2>
        <span class="close-x" id="modal-close-x">&times;</span>
      </div>
      <p id="winner-reason" class="winner-reason"></p>

      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Solved</th>
            <th>Mistakes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>

      <button class="btn primary full-width" onclick="location.reload()">Back to Lobby</button>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
