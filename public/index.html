<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="scenic-bg" class="scenic-bg bg-milkyway">
    <div class="scenic-overlay"></div>
  </div>

  <div class="arena-container">
    <div class="top-bar">
      <h1>⚡ Sudoku Arena</h1>
      <button id="settings-open-btn" class="icon-btn" title="Game Settings">
        ⚙️ Settings
      </button>
    </div>

    <!-- Lobby View -->
    <div id="lobby-view" class="card frosted">
      <div class="input-group">
        <label for="username">Nickname:</label>
        <input type="text" id="username" placeholder="e.g. MasterSolver" maxlength="12" />
      </div>

      <!-- Mode Selector: Multiplayer vs Solo vs Bot -->
      <div class="mode-select-wrap">
        <label class="radio-label">
          <input type="radio" name="game-mode" value="multi" checked />
          <span>👥 Multiplayer Room</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="game-mode" value="bot" />
          <span>🤖 Solo vs Bot</span>
        </label>
      </div>

      <div class="host-settings">
        <div class="setting-col">
          <label for="symbol-set-select">Symbol Set:</label>
          <select id="symbol-set-select">
            <option value="numbers">1 - 9 (Standard)</option>
            <option value="letters">A - I (Letters)</option>
            <option value="roman">I - IX (Roman)</option>
            <option value="emojis">🍎 Fruits (Emojis)</option>
            <option value="shapes">★ Shapes</option>
          </select>
        </div>

        <div class="setting-col">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">Easy (20 Blanks)</option>
            <option value="medium" selected>Medium (35 Blanks)</option>
            <option value="hard">Hard (50 Blanks)</option>
          </select>
        </div>

        <!-- Hidden when in Bot mode -->
        <div class="setting-col" id="col-max-players">
          <label for="max-players">Players:</label>
          <select id="max-players">
            <option value="2" selected>2 Players</option>
            <option value="3">3 Players</option>
            <option value="4">4 Players</option>
          </select>
        </div>

        <!-- Shown when in Bot mode -->
        <div class="setting-col hidden" id="col-bot-speed">
          <label for="bot-speed">Bot Skill:</label>
          <select id="bot-speed">
            <option value="slow">Casual (Slow)</option>
            <option value="medium" selected>Balanced</option>
            <option value="fast">Master (Fast)</option>
          </select>
        </div>

        <div class="setting-col">
          <label for="custom-duration">Time (Mins):</label>
          <input type="number" id="custom-duration" min="1" max="60" value="10" />
        </div>
      </div>

      <div class="actions">
        <button id="create-btn" class="btn primary">Start Game</button>
        <div id="multi-join-container">
          <div class="divider">OR</div>
          <div class="join-group">
            <input type="text" id="room-code-input" placeholder="5-Letter Room Code" maxlength="5" />
            <button id="join-btn" class="btn secondary">Join Room</button>
          </div>
        </div>
      </div>

      <div id="room-status" class="status-msg"></div>
      <div id="lobby-roster" class="roster-list"></div>
    </div>

    <!-- Active Game Arena -->
    <div id="game-view" class="card frosted hidden">
      <div class="hud">
        <div class="hud-top">
          <div class="room-tag">Match: <span id="current-room"></span></div>
          <div class="my-lives" id="my-lives">Lives: ❤️❤️❤️</div>
          <div class="timer-box">⏳ <span id="timer-display">10:00</span></div>
          <button id="quit-btn" class="btn danger-small" title="Quit match">Resign 🏳️</button>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
      </div>

      <div class="board-wrapper">
        <div id="sudoku-grid" class="sudoku-grid"></div>
      </div>

      <div class="symbol-pad-container">
        <span class="symbol-pad-title">Tap a cell, then tap a symbol to place it:</span>
        <div id="symbol-pad" class="symbol-pad"></div>
      </div>

      <div id="eliminated-banner" class="banner hidden">
        ❌ You were eliminated!
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card frosted settings-card">
      <div class="modal-header">
        <h2>⚙️ Arena Settings</h2>
        <span class="close-x" id="settings-close-x">&times;</span>
      </div>

      <div class="settings-grid">
        <div class="setting-row">
          <label for="bg-select">Scenery Backdrop:</label>
          <select id="bg-select">
            <option value="milkyway">🌌 Milky Way Galaxy</option>
            <option value="sunset">🌄 Mountain Sunset</option>
            <option value="forest">🌲 Misty Redwood Forest</option>
            <option value="city">🏙️ Tokyo Night City</option>
            <option value="ocean">🌊 Twilight Ocean</option>
            <option value="mountains">🏔️ Snowy Alpine Peak</option>
          </select>
        </div>
         
        <div class="setting-toggle-row">
         <label for="vibration-toggle">📳 Haptic Vibration</label>
         <input type="checkbox" id="vibration-toggle" checked class="toggle-checkbox" />
        </div>
        
        <div class="setting-row">
          <label for="theme-select">Theme Palette:</label>
          <select id="theme-select">
            <option value="dark">Midnight Dark</option>
            <option value="neon">Cyber Neon</option>
            <option value="emerald">Emerald</option>
            <option value="sunset">Sunset Orange</option>
            <option value="dracula">Dracula</option>
            <option value="amber">Amber</option>
            <option value="paper">Paper Light</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="font-select">Font Family:</label>
          <select id="font-select">
            <option value="default">Default Sans</option>
            <option value="fredoka">Fun / Rounded</option>
            <option value="cinzel">Roman / Serif</option>
            <option value="mono">Code / Mono</option>
            <option value="arcade">8-Bit Arcade</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="custom-color-picker">Accent Color:</label>
          <div class="color-picker-wrap">
            <input type="color" id="custom-color-picker" value="#38bdf8" />
            <span class="color-hint">Tap circle to pick</span>
          </div>
        </div>

        <!-- Music & Sound Effect Toggles -->
        <div class="setting-toggle-row">
          <label for="music-toggle">🎵 Background Music</label>
          <input type="checkbox" id="music-toggle" class="toggle-checkbox" />
        </div>

        <div class="setting-toggle-row">
          <label for="sound-toggle">🔊 Game Sound FX</label>
          <input type="checkbox" id="sound-toggle" checked class="toggle-checkbox" />
        </div>

        <div class="setting-toggle-row">
          <label for="emoji-toggle">✨ Completion Emojis</label>
          <input type="checkbox" id="emoji-toggle" checked class="toggle-checkbox" />
        </div>
      </div>

      <button id="settings-save-btn" class="btn primary full-width">Done</button>
    </div>
  </div>

  <!-- End of Match Leaderboard Modal -->
  <div id="winner-modal" class="modal-backdrop hidden">
    <div class="modal-card frosted">
      <div class="modal-header">
        <h2>🏆 Match Over</h2>
        <span class="close-x" id="modal-close-x">&times;</span>
      </div>
      <p id="winner-reason" class="winner-reason"></p>

      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Solved</th>
            <th>Mistakes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>

      <button class="btn primary full-width" onclick="location.reload()">Back to Lobby</button>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
